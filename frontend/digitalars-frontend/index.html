<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital ARS</title>
  </head>
  <body style="margin: 0; background-color: #f8fafc">
    <div id="root">
      <!-- Se muestra en el milisegundo 0 mientras descarga React y desaparece solo -->
      <div
        style="
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          font-family:
            system-ui,
            -apple-system,
            sans-serif;
          color: #1e3a5f;
        "
      >
        <div
          style="
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 20px;
          "
        >
          <h2
            style="
              margin: 0;
              font-size: 1.5rem;
              font-weight: 700;
              letter-spacing: -0.5px;
            "
          >
            Digital ARS
          </h2>
        </div>

        <div
          style="
            width: 34px;
            height: 34px;
            border: 3px solid #e2e8f0;
            border-top-color: #1976d2;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
          "
        ></div>
      </div>
      <style>
        @keyframes spin {
          to {
            transform: rotate(360deg);
          }
        }
      </style>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
